<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملف شواهد الأداء الوظيفي — الأستاذ نايف المطيري</title>
<meta name="description" content="ملف شواهد الأداء الوظيفي — محاور تقييم أداء المعلم وبنود كل معيار مع مجلد شواهد مستقل.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --em-900:#0A3527;
  --em-800:#0E4432;
  --em-700:#12543E;
  --em-500:#2E8B68;
  --gold:#B08D2E;
  --gold-mid:#C9A44C;
  --gold-light:#E2D3A6;
  --ink:#16201C;
  --ink-soft:#5B6961;
  --paper:#F7F6F1;
  --card:#FFFFFF;
  --line:#E4E9E4;
  --tint:#F3F7F4;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",sans-serif;
  font-weight:400;line-height:1.85;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,.kufi{font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",sans-serif;font-weight:600;line-height:1.5}

/* ═══ الترويسة ═══ */
header{
  background:linear-gradient(165deg,var(--em-900) 0%,var(--em-700) 60%,var(--em-800) 100%);
  color:#fff;padding:34px 24px 0;position:relative;overflow:hidden;
}
header::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.028) 0 6px, transparent 6px 24px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.028) 0 6px, transparent 6px 24px);
}
header::after{
  content:"";position:absolute;inset:auto 0 0 0;height:5px;
  background:linear-gradient(90deg,var(--gold) 0%,var(--gold-light) 50%,var(--gold) 100%);
}
.head-wrap{max-width:1080px;margin:0 auto;position:relative;z-index:1}

.crest-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:26px}
.plaque{
  background:#fff;border-radius:7px;padding:14px 22px;display:flex;align-items:center;
  box-shadow:0 3px 18px rgba(0,0,0,.18);border-bottom:3px solid var(--gold);
}
.plaque img{height:66px;width:auto;display:block}
.authority{
  font-family:"Noto Kufi Arabic",sans-serif;font-size:1.08rem;color:#EDF4F0;
  font-weight:500;letter-spacing:.005em;line-height:1.6;
}

.title-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{font-size:clamp(1.7rem,4.4vw,2.65rem);margin:0;font-weight:700;letter-spacing:-.005em}
.rule{height:1px;background:linear-gradient(90deg,rgba(226,211,166,.55),transparent);margin:20px 0 0}

.head-meta{display:flex;flex-wrap:wrap;gap:34px;padding:20px 0 30px}
.head-meta div{min-width:120px}
.head-meta span{display:block;font-size:.74rem;color:#93B9A6;margin-bottom:3px;letter-spacing:.1em}
.head-meta strong{font-weight:500;font-size:1.02rem;color:#fff}

/* ═══ شريط المحاور ═══ */
nav.rail{
  position:sticky;top:0;z-index:30;background:rgba(247,246,241,.95);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(176,141,46,.18);
}
.rail-wrap{max-width:1080px;margin:0 auto;display:flex;gap:2px;padding:0 16px;overflow-x:auto}
.rail button{
  appearance:none;background:none;border:0;border-bottom:3px solid transparent;
  font:inherit;font-family:"Noto Kufi Arabic",sans-serif;font-size:.94rem;
  color:var(--ink-soft);padding:17px 16px;cursor:pointer;white-space:nowrap;
  transition:color .18s,border-color .18s;
}
.rail button:hover{color:var(--em-700)}
.rail button[aria-selected="true"]{color:var(--em-900);border-color:var(--gold);font-weight:600}
.rail button:focus-visible{outline:2px solid var(--em-500);outline-offset:-4px}
.rail .n{
  display:inline-block;background:#E8EEEA;color:var(--em-800);
  width:23px;height:23px;line-height:23px;text-align:center;border-radius:50%;
  font-size:.78rem;margin-left:9px;vertical-align:1px;transition:background .18s,color .18s;
}
.rail button[aria-selected="true"] .n{background:var(--gold);color:#fff}

main{max-width:1080px;margin:0 auto;padding:34px 20px 78px}

/* ═══ حالة الربط ═══ */
.status{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-right:4px solid var(--gold);
  padding:15px 20px;margin-bottom:32px;border-radius:4px;
  box-shadow:0 1px 3px rgba(10,53,39,.05);
}
.status p{margin:0;font-size:.93rem;color:var(--ink-soft)}
.status strong{color:var(--em-900);font-family:"Noto Kufi Arabic",sans-serif}
.bar{flex:1;min-width:170px;height:7px;background:#E9EFEB;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--em-700),var(--em-500));transition:width .5s}

/* ═══ المحور ═══ */
.axis-title{
  font-size:1.3rem;color:var(--em-900);margin:0 0 5px;padding-bottom:15px;
  border-bottom:1px solid var(--line);position:relative;
}
.axis-title::after{content:"";position:absolute;right:0;bottom:-1px;width:64px;height:2px;background:var(--gold)}
.axis-note{color:var(--ink-soft);font-size:.9rem;margin:12px 0 28px}

/* ═══ بطاقة المعيار ═══ */
.std{
  background:var(--card);border:1px solid var(--line);border-radius:5px;
  margin-bottom:22px;overflow:hidden;box-shadow:0 1px 3px rgba(10,53,39,.05);
  transition:box-shadow .2s,border-color .2s;
}
.std:hover{box-shadow:0 4px 16px rgba(10,53,39,.09);border-color:#D6E0D8}
.std-head{
  display:flex;align-items:flex-start;gap:15px;padding:21px 24px 17px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,#FDFDFB,#FFF);
}
.code{
  flex:none;font-family:"Noto Kufi Arabic",sans-serif;font-size:.85rem;
  color:var(--gold);border:1px solid var(--gold-light);background:#FDFBF5;
  border-radius:3px;padding:4px 10px;margin-top:2px;letter-spacing:.02em;
}
.std-head h3{margin:0;font-size:1.1rem;color:var(--em-900)}
.cols{display:grid;grid-template-columns:1.35fr 1fr;gap:0}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.col{padding:19px 24px 24px}
.col:first-child{border-left:1px solid var(--line)}
@media(max-width:760px){.col:first-child{border-left:0;border-bottom:1px solid var(--line)}}
.col h4{
  margin:0 0 13px;font-size:.76rem;font-weight:500;color:var(--gold);
  font-family:"Noto Kufi Arabic",sans-serif;letter-spacing:.16em;padding-right:.16em;
}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0;padding:0;list-style:none}
.chips li{
  background:var(--tint);border:1px solid #E0E9E3;border-radius:15px;
  padding:5px 13px;font-size:.855rem;color:#2F4139;
}
.ev{margin:0 0 18px;padding:0;list-style:none}
.ev li{position:relative;padding-right:19px;font-size:.9rem;color:#2F4139;line-height:2}
.ev li::before{
  content:"";position:absolute;right:1px;top:14px;width:6px;height:6px;
  background:var(--gold);transform:rotate(45deg);
}
.drive{
  display:inline-flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,var(--em-700),var(--em-900));
  color:#fff;text-decoration:none;font-family:"Noto Kufi Arabic",sans-serif;font-size:.9rem;
  padding:11px 20px;border-radius:4px;border-bottom:3px solid var(--gold);
  box-shadow:0 2px 6px rgba(10,53,39,.15);transition:transform .15s,box-shadow .15s;
}
.drive:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(10,53,39,.22)}
.drive:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.drive svg{width:17px;height:17px;flex:none}
.drive.empty{
  background:var(--tint);color:var(--ink-soft);border:1px dashed #CBD8CF;
  border-bottom:1px dashed #CBD8CF;box-shadow:none;cursor:not-allowed;
}

/* ═══ التذييل ═══ */
footer{
  text-align:center;color:var(--ink-soft);font-size:.86rem;
  padding:30px 20px 38px;border-top:1px solid var(--line);background:#FDFDFB;
}
footer .orn{display:flex;align-items:center;justify-content:center;gap:9px;width:180px;margin:0 auto 14px}
footer .orn .l{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-mid),transparent)}
footer .orn .d{width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
footer strong{display:block;font-family:"Noto Kufi Arabic",sans-serif;color:var(--em-900);
  font-size:1rem;font-weight:600;margin-bottom:4px}

@media print{
  nav.rail,.status,footer{display:none!important}
  body{background:#fff}
  header{padding-top:22px}
  header::before{display:none}
  main{padding:0}
  .axis-pane{display:block!important;break-before:page}
  .axis-pane:first-of-type{break-before:auto}
  .std{break-inside:avoid;border-color:#bbb;box-shadow:none}
  .drive{border:1px solid #888;background:#fff!important;color:#000!important;box-shadow:none}
  @page{size:A4;margin:14mm}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
</style>

        items:["الاختبارات التشخيصية","المهارات المفقودة","خطط علاجية وإثرائية","ملفات الإنجاز","تصحيح الكتب","تحليل النتائج","التحفيز","نتائج نافس"],
        ev:["تصحيح الكتب","ملفات الطلاب","تقارير نافس"] },
      { id:"4-2", title:"تحليل نتائج وتشخيص مستويات المتعلمين",
        items:["تحليل التقييم","تحديد نقاط القوة والضعف","إشراك الطلاب"],
        ev:["رسوم بيانية","استمارات تشخيص"] },
      { id:"4-3", title:"تنوع أساليب التقويم",
        items:["تنوع المصادر","المهام الأدائية","التغذية الراجعة","التقويم التكويني والختامي","معايير الاختبار الجيد"],
        ev:["نماذج الاختبارات","سجل المهام","سجل الدرجات"] }
    ]
  }
];

/* ═══════════ بناء الصفحة ═══════════ */
const ar = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const driveIcon = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 4h-6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg>';

document.getElementById("m-teacher").textContent = INFO.teacher;
document.getElementById("m-subject").textContent = INFO.subject;
document.getElementById("m-year").textContent    = INFO.year;

const rail  = document.getElementById("rail");
const panes = document.getElementById("panes");

AXES.forEach((ax, i) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.setAttribute("role","tab");
  btn.setAttribute("aria-selected", i === 0 ? "true" : "false");
  btn.setAttribute("aria-controls","pane-"+i);
  btn.innerHTML = '<span class="n">'+ax.n+'</span>'+esc(ax.title);
  btn.onclick = () => show(i);
  rail.appendChild(btn);

  const pane = document.createElement("section");
  pane.className = "axis-pane";
  pane.id = "pane-"+i;
  pane.setAttribute("role","tabpanel");
  pane.style.display = i === 0 ? "block" : "none";
  pane.innerHTML =
    '<h2 class="axis-title">المحور '+ax.n+' — '+esc(ax.title)+'</h2>'+
    '<p class="axis-note">'+esc(ax.note)+'</p>'+
    ax.stds.map(s => card(s)).join("");
  panes.appendChild(pane);
});

function card(s){
  const url = FOLDERS[s.id];
  const btn = url
    ? '<a class="drive" href="'+esc(url)+'" target="_blank" rel="noopener">'+driveIcon+'فتح مجلد الشواهد</a>'
    : '<span class="drive empty">'+driveIcon+'لم يُربط مجلد بعد</span>';
  return '<article class="std">'+
    '<div class="std-head"><span class="code">'+ar(s.id.replace("-","/"))+'</span><h3>'+esc(s.title)+'</h3></div>'+
    '<div class="cols">'+
      '<div class="col"><h4>البنود المقيَّمة</h4><ul class="chips">'+
        s.items.map(t => '<li>'+esc(t)+'</li>').join("")+
      '</ul></div>'+
      '<div class="col"><h4>الشواهد المطلوبة</h4><ul class="ev">'+
        s.ev.map(t => '<li>'+esc(t)+'</li>').join("")+
      '</ul>'+btn+'</div>'+
    '</div></article>';
}

function show(i){
  [...rail.children].forEach((b,j) => b.setAttribute("aria-selected", j === i ? "true" : "false"));
  [...panes.children].forEach((p,j) => p.style.display = j === i ? "block" : "none");
  window.scrollTo({top:0,behavior:"smooth"});
}

const keys   = Object.keys(FOLDERS);
const linked = keys.filter(k => FOLDERS[k]).length;
document.getElementById("linked").textContent = ar(linked);
document.getElementById("total").textContent  = ar(keys.length);
document.getElementById("bar").style.width    = (linked / keys.length * 100) + "%";
</script>
</body>
</html>
